<div class="min-h-screen bg-slate-50 py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-3xl mx-auto">
    <!-- Cabeçalho -->
    <div class="mb-8 pb-6 border-b border-slate-200 flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-bold tracking-tight text-slate-900">Novo Memorial</h1>
        <p class="mt-1 text-sm text-slate-500">
          Preencha os dados abaixo para eternizar a história de alguém especial.
        </p>
      </div>
      <a routerLink="/dashboard" class="text-sm font-medium text-indigo-600 hover:text-indigo-800">
        &larr; Voltar para o painel
      </a>
    </div>

    <!-- Erro global -->
    <div
      *ngIf="errorMessage"
      class="mb-6 rounded-lg bg-red-50 p-4 text-sm text-red-700 border border-red-200"
    >
      {{ errorMessage }}
    </div>

    <!-- Formulário Reativo -->
    <form
      [formGroup]="memorialForm"
      (ngSubmit)="onSubmit()"
      class="bg-white shadow-sm border border-slate-200 rounded-xl p-6 sm:p-8 space-y-6"
    >
      <!-- Dados Básicos -->
      <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
        <div class="sm:col-span-2">
          <label class="block text-sm font-medium text-slate-700"
            >Nome Completo do Homenageado *</label
          >
          <input
            type="text"
            formControlName="fullName"
            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
            placeholder="Ex: Maria da Silva"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700">Data de Nascimento *</label>
          <input
            type="date"
            formControlName="birthDate"
            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700">Data de Falecimento *</label>
          <input
            type="date"
            formControlName="deathDate"
            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700">Cidade de Nascimento *</label>
          <input
            type="text"
            formControlName="birthCity"
            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
            placeholder="Ex: Avaré - SP"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700">Cidade de Falecimento *</label>
          <input
            type="text"
            formControlName="deathCity"
            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
            placeholder="Ex: Avaré - SP"
          />
        </div>

        <div class="sm:col-span-2">
          <label class="block text-sm font-medium text-slate-700"
            >Cemitério / Local de Sepultamento *</label
          >
          <input
            type="text"
            formControlName="cemetery"
            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
            placeholder="Ex: Cemitério Municipal"
          />
        </div>
      </div>

      <!-- Biografia -->
      <div>
        <label class="block text-sm font-medium text-slate-700"
          >Biografia / História de Vida *</label
        >
        <textarea
          formControlName="biography"
          rows="5"
          class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
          placeholder="Escreva sobre a trajetória, legado e lembranças queridas..."
        ></textarea>
      </div>

      <!-- Upload de Imagens -->
      <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 pt-4 border-t border-slate-200">
        <div>
          <label class="block text-sm font-medium text-slate-700"
            >Foto de Perfil (Obrigatório) *</label
          >
          <input
            type="file"
            (change)="onProfilePicSelected($event)"
            accept="image/*"
            class="mt-1 block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700"
            >Fotos da Galeria (Opcional)</label
          >
          <input
            type="file"
            (change)="onGallerySelected($event)"
            accept="image/*"
            multiple
            class="mt-1 block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200"
          />
        </div>
      </div>

      <!-- Botões de Ação -->
      <div class="flex items-center justify-end gap-4 pt-6 border-t border-slate-200">
        <button
          type="button"
          routerLink="/dashboard"
          class="rounded-lg px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100 transition-colors"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="loading || memorialForm.invalid"
          class="inline-flex items-center justify-center rounded-lg bg-indigo-600 px-6 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 disabled:opacity-50 transition-all"
        >
          <span
            *ngIf="loading"
            class="animate-spin mr-2 h-4 w-4 border-b-2 border-white rounded-full"
          ></span>
          {{ loading ? 'Salvando memorial...' : 'Criar Memorial' }}
        </button>
      </div>
    </form>
  </div>
</div>
